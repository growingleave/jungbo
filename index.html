<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유전 로보틱스 미로</title>
<style>
  /* 레이아웃: 미로 캔버스가 주인공, 조작 버튼과 수치는 아래에 한 줄씩 */
  :root {
    --bg: #f3f5f8; --fg: #1c2330; --muted: #5d6879; --panel: #ffffff; --line: #d3d9e2;
    --floor: #ffffff; --wall: #2b3445; --start: #2f9e5b; --goal: #d6336c; --path: #2f6bff;
    --btn: #2f6bff; --btn-fg: #ffffff; --best: #e8590c;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12161d; --fg: #e4e9f1; --muted: #98a3b5; --panel: #1b212c; --line: #323b4a;
    --floor: #1b212c; --wall: #aab4c6; --start: #4cc27f; --goal: #ff6b9a; --path: #6f9bff;
    --btn: #6f9bff; --btn-fg: #101520; --best: #ffa94d; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12161d; --fg: #e4e9f1; --muted: #98a3b5; --panel: #1b212c; --line: #323b4a;
    --floor: #1b212c; --wall: #aab4c6; --start: #4cc27f; --goal: #ff6b9a; --path: #6f9bff;
    --btn: #6f9bff; --btn-fg: #101520; --best: #ffa94d; color-scheme: dark; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 1.25rem; margin: 0; text-wrap: balance; }
  .sub { margin: 0; color: var(--muted); font-size: .9rem; }
  canvas { width: 100%; height: auto; display: block; border: 1px solid var(--line); border-radius: 6px; background: var(--floor); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; }
  label { color: var(--muted); display: flex; gap: 6px; align-items: center; margin-left: auto; }
  input { font: inherit; width: 5em; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  pre { margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    font: .9rem/1.5 ui-monospace, Menlo, Consolas, monospace; min-height: 6.6em; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>유전 로보틱스 미로 · 1단계</h1>
  <p class="sub">상하좌우 벽 센서 4개만 가진 신경망을 유전 알고리즘으로 진화시킵니다. 10×10칸 미로에서 오른쪽 위(초록)에서 출발해 왼쪽 아래(분홍)에 도착해야 합니다. 파란 점은 한 세대 개체 100마리가 동시에 움직이는 모습이고, 주황 점은 그 세대 최고 개체입니다.</p>
  <canvas id="cv" width="600" height="600" aria-label="미로와 최고 개체의 이동 경로"></canvas>
  <div class="row">
    <button id="start" class="primary">시작</button>
    <button id="pause">일시정지</button>
    <button id="reset">초기화</button>
    <label for="seed">시드 <input id="seed" type="number" value="1"></label>
  </div>
  <div class="row">
    <label for="speed" style="margin-left:0">속도 <input id="speed" type="range" min="5" max="300" value="50" style="width:12em"></label>
  </div>
  <pre id="info" aria-live="off"></pre>
</main>

<script>
// ---- 설정 ----
const N = 10;                 // 미로 크기 (N x N 칸)
const HIDDEN = 6, STEPS = 200, POP = 100;
const GENE_LEN = 4 * HIDDEN + HIDDEN + HIDDEN * 4 + 4;
const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]]; // 상 하 좌 우
const OPP = [1, 0, 3, 2];

// ---- 시드 가능한 난수 ----
function makeRng(seed) {
  let a = seed >>> 0;
  const rnd = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rnd.int = n => Math.floor(rnd() * n);
  rnd.normal = (m = 0, s = 1) =>
    m + s * Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  return rnd;
}

// ---- 미로: 칸마다 상하좌우 벽 여부를 가진다. 크러스컬 방식이라 갈림길과 막다른 길이 많다 ----
function makeMaze(n, rnd) {
  const walls = Array.from({ length: n }, () => Array.from({ length: n }, () => [1, 1, 1, 1]));
  const parent = Array.from({ length: n * n }, (_, i) => i);
  const find = x => (parent[x] === x ? x : (parent[x] = find(parent[x])));
  const edges = [];
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++) {
      if (r + 1 < n) edges.push([r, c, 1]);
      if (c + 1 < n) edges.push([r, c, 3]);
    }
  for (let i = edges.length - 1; i > 0; i--) {          // 섞기
    const j = rnd.int(i + 1);
    [edges[i], edges[j]] = [edges[j], edges[i]];
  }
  for (const [r, c, d] of edges) {
    const r2 = r + DIRS[d][0], c2 = c + DIRS[d][1];
    const a = find(r * n + c), b = find(r2 * n + c2);
    if (a === b) continue;                               // 이미 연결되어 있으면 벽 유지
    parent[a] = b;
    walls[r][c][d] = 0; walls[r2][c2][OPP[d]] = 0;
  }
  const maze = { n, walls, start: [0, n - 1], goal: [n - 1, 0] };
  maze.shortest = shortestPath(maze);
  return maze;
}

function shortestPath(maze) {
  const { n, walls, start, goal } = maze;
  const dist = Array.from({ length: n }, () => Array(n).fill(-1));
  dist[start[0]][start[1]] = 0;
  const q = [start];
  for (let i = 0; i < q.length; i++) {
    const [r, c] = q[i];
    for (let d = 0; d < 4; d++) {
      if (walls[r][c][d]) continue;
      const nr = r + DIRS[d][0], nc = c + DIRS[d][1];
      if (dist[nr][nc] < 0) { dist[nr][nc] = dist[r][c] + 1; q.push([nr, nc]); }
    }
  }
  return dist[goal[0]][goal[1]];
}

// ---- 신경망: 입력 4 -> 은닉 6(tanh) -> 출력 4 ----
function decode(g) {
  let k = 0;
  const w1 = g.slice(k, k += 4 * HIDDEN);
  const b1 = g.slice(k, k += HIDDEN);
  const w2 = g.slice(k, k += HIDDEN * 4);
  const b2 = g.slice(k, k += 4);
  return { w1, b1, w2, b2 };
}

function run(gene, maze) {
  const { w1, b1, w2, b2 } = decode(gene);
  let [r, c] = maze.start;
  const path = [[r, c]];
  for (let t = 0; t < STEPS; t++) {
    if (r === maze.goal[0] && c === maze.goal[1]) break; // 도착하면 멈춘다
    const s = maze.walls[r][c];                           // 센서: 상하좌우 벽이면 1
    const h = [];
    for (let j = 0; j < HIDDEN; j++) {
      let v = b1[j];
      for (let i = 0; i < 4; i++) v += s[i] * w1[i * HIDDEN + j];
      h.push(Math.tanh(v));
    }
    let best = 0, bestV = -Infinity;
    for (let o = 0; o < 4; o++) {
      let v = b2[o];
      for (let j = 0; j < HIDDEN; j++) v += h[j] * w2[j * 4 + o];
      if (v > bestV) { bestV = v; best = o; }
    }
    if (!s[best]) { r += DIRS[best][0]; c += DIRS[best][1]; } // 벽이면 제자리
    path.push([r, c]);
  }
  return path;
}

// 적합도 = -(마지막 위치와 목표의 직선거리)
function fitnessOf(path, maze) {
  const [r, c] = path.at(-1);
  return -Math.hypot(r - maze.goal[0], c - maze.goal[1]);
}

// ---- 유전 알고리즘 + 실시간 애니메이션 ----
// 한 세대 = 모든 개체가 동시에 출발해 STEPS 걸음 움직이는 장면 -> 점수 계산 -> 다음 세대 생성
let rnd, maze, pop, gen, runs, t, acc, holdLeft, running = false, last = 0;
const speedEl = document.getElementById("speed");
const stepsPerSec = () => Number(speedEl.value);

function init() {
  running = false;
  rnd = makeRng(Number(document.getElementById("seed").value));
  maze = makeMaze(N, rnd);
  pop = Array.from({ length: POP }, () =>
    Array.from({ length: GENE_LEN }, () => rnd.normal())); // 처음엔 완전 난수
  gen = 0;
  beginGeneration();
  t = 0;
  render();
}

function beginGeneration() {
  runs = pop.map((g, i) => {
    const path = run(g, maze);
    return { i, path, f: fitnessOf(path, maze) };
  });
  runs.sort((a, b) => b.f - a.f);                 // runs[0] = 이번 세대 최고 개체
  t = 0; acc = 0; holdLeft = 0;
}

function breed() {
  const parents = runs.slice(0, POP / 5).map(x => pop[x.i]); // 상위 20%
  const next = parents.slice();
  while (next.length < POP) {
    const a = parents[rnd.int(parents.length)], b = parents[rnd.int(parents.length)];
    const cut = 1 + rnd.int(GENE_LEN - 1); // 한 점 교차
    const child = a.slice(0, cut).concat(b.slice(cut));
    for (let i = 0; i < GENE_LEN; i++)
      if (rnd() < 0.05) child[i] += rnd.normal(0, 0.5); // 돌연변이
    next.push(child);
  }
  pop = next;
  gen++;
  beginGeneration();
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (running) {
    if (t < STEPS) {
      acc += dt * stepsPerSec();
      while (acc >= 1 && t < STEPS) { t++; acc -= 1; }
    } else {
      holdLeft += dt;                              // 세대가 끝나면 잠깐 멈춰서 결과를 보여준다
      if (holdLeft > 0.8) breed();
    }
    render();
  }
  requestAnimationFrame(frame);
}

// ---- 그리기 (색은 CSS 토큰에서 읽는다) ----
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const posAt = (path, k) => path[Math.min(k, path.length - 1)];
function render() {
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const pad = 24, s = (cv.width - 2 * pad) / maze.n;
  const X = c => pad + c * s, Y = r => pad + r * s;
  const cx = c => X(c) + s / 2, cy = r => Y(r) + s / 2;
  ctx.fillStyle = css("--floor"); ctx.fillRect(0, 0, cv.width, cv.height);

  const dot = (p, col, rad) => { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx(p[1]), cy(p[0]), rad, 0, 7); ctx.fill(); };

  // 벽: 위/왼쪽 벽은 모든 칸, 아래/오른쪽 벽은 가장자리 칸만 그려 중복을 피한다
  ctx.strokeStyle = css("--wall"); ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.beginPath();
  const line = (x1, y1, x2, y2) => { ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); };
  for (let r = 0; r < maze.n; r++)
    for (let c = 0; c < maze.n; c++) {
      const w = maze.walls[r][c];
      const isStartTop = r === maze.start[0] && c === maze.start[1];   // 입구: 바깥벽 구멍
      const isGoalLeft = r === maze.goal[0] && c === maze.goal[1];     // 출구: 바깥벽 구멍
      if (w[0] && !isStartTop) line(X(c), Y(r), X(c + 1), Y(r));
      if (w[2] && !isGoalLeft) line(X(c), Y(r), X(c), Y(r + 1));
      if (r === maze.n - 1 && w[1]) line(X(c), Y(r + 1), X(c + 1), Y(r + 1));
      if (c === maze.n - 1 && w[3]) line(X(c + 1), Y(r), X(c + 1), Y(r + 1));
    }
  ctx.stroke();

  dot(maze.start, css("--start"), s * 0.22); dot(maze.goal, css("--goal"), s * 0.22);

  // 최고 개체의 지나온 길 (흔적)
  const best = runs[0].path;
  ctx.strokeStyle = css("--path"); ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.globalAlpha = 0.45; ctx.beginPath();
  for (let k = 0; k <= Math.min(t, best.length - 1); k++) {
    const [r, c] = best[k];
    k ? ctx.lineTo(cx(c), cy(r)) : ctx.moveTo(cx(c), cy(r));
  }
  ctx.stroke(); ctx.globalAlpha = 1;

  // 모든 개체: 못한 개체부터 그려서 최고 개체가 맨 위에 보이게
  for (let k = runs.length - 1; k >= 1; k--) {
    ctx.globalAlpha = 0.4; dot(posAt(runs[k].path, t), css("--path"), s * 0.13);
  }
  ctx.globalAlpha = 1; dot(posAt(best, t), css("--best"), s * 0.2);

  const mean = runs.reduce((a, x) => a + x.f, 0) / POP;
  const done = t >= STEPS;
  const solved = runs.filter(x => x.f === 0).length;
  document.getElementById("info").textContent =
    `세대 ${gen}   걸음 ${Math.min(t, STEPS)}/${STEPS}\n` +
    `최고 적합도 ${runs[0].f.toFixed(2)}  평균 ${mean.toFixed(2)}\n` +
    `도착한 개체 ${done ? solved : "?"}/${POP} ${done ? "" : "(세대가 끝나면 집계)"}\n` +
    `미로 ${N}x${N}칸, 최단 경로 ${maze.shortest}칸`;
}

document.getElementById("start").onclick = () => { running = true; };
document.getElementById("pause").onclick = () => { running = false; };
document.getElementById("reset").onclick = init;
document.getElementById("seed").onchange = init;
init();
requestAnimationFrame(frame);
</script>
</body>
</html>
