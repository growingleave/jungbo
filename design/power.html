<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="228mm" height="210mm" viewBox="0 0 228 210" font-family="inherit"><text x="8" y="10" font-size="5" text-anchor="start" font-weight="bold" fill="#111">전원 연결 (건전지 → 승압 모듈, 모터 드라이버)</text><rect x="8" y="30" width="44" height="30" rx="2" fill="#fff3d6" stroke="#e8a317" stroke-width=".6"/><text x="30" y="38" font-size="3.6" text-anchor="middle" font-weight="bold" fill="#111">AAA×3 홀더</text><text x="30" y="45" font-size="3" text-anchor="middle" font-weight="normal" fill="#111">(4.5V)</text><polyline points="52,40 70,40" fill="none" stroke="#d9242f" stroke-width="1.2" stroke-linejoin="round" /><text x="56" y="38" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">빨강 +</text><polyline points="52,54 70,54" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" /><text x="56" y="52" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">검정 −</text><rect x="70" y="22" width="96" height="72" rx="2" fill="#f8f9fa" stroke="#adb5bd" stroke-width=".6"/><text x="118" y="29" font-size="3.2" text-anchor="middle" font-weight="bold" fill="#111">작은 브레드보드 한 장 (전원 분배용)</text><rect x="76" y="36.5" width="38" height="7" rx="1.5" fill="#d9242f" fill-opacity=".14" stroke="#d9242f" stroke-width=".4"/><circle cx="82" cy="40" r="1.4" fill="#adb5bd"/><circle cx="89" cy="40" r="1.4" fill="#adb5bd"/><circle cx="96" cy="40" r="1.4" fill="#adb5bd"/><circle cx="103" cy="40" r="1.4" fill="#adb5bd"/><circle cx="110" cy="40" r="1.4" fill="#adb5bd"/><text x="118" y="41.2" font-size="3.2" text-anchor="start" font-weight="bold" fill="#d9242f">+ 줄 A</text><rect x="76" y="56.5" width="38" height="7" rx="1.5" fill="#d9242f" fill-opacity=".14" stroke="#d9242f" stroke-width=".4"/><circle cx="82" cy="60" r="1.4" fill="#adb5bd"/><circle cx="89" cy="60" r="1.4" fill="#adb5bd"/><circle cx="96" cy="60" r="1.4" fill="#adb5bd"/><circle cx="103" cy="60" r="1.4" fill="#adb5bd"/><circle cx="110" cy="60" r="1.4" fill="#adb5bd"/><text x="118" y="61.2" font-size="3.2" text-anchor="start" font-weight="bold" fill="#d9242f">+ 줄 B</text><rect x="76" y="76.5" width="38" height="7" rx="1.5" fill="#111" fill-opacity=".14" stroke="#111" stroke-width=".4"/><circle cx="82" cy="80" r="1.4" fill="#adb5bd"/><circle cx="89" cy="80" r="1.4" fill="#adb5bd"/><circle cx="96" cy="80" r="1.4" fill="#adb5bd"/><circle cx="103" cy="80" r="1.4" fill="#adb5bd"/><circle cx="110" cy="80" r="1.4" fill="#adb5bd"/><text x="118" y="81.2" font-size="3.2" text-anchor="start" font-weight="bold" fill="#111">− 줄</text><circle cx="82" cy="40" r="1.4" fill="#d9242f"/><circle cx="82" cy="80" r="1.4" fill="#111"/><polyline points="70,40 82,40" fill="none" stroke="#d9242f" stroke-width="1.2" stroke-linejoin="round" /><polyline points="70,54 74,54 74,80 82,80" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" /><polyline points="89,40 89,60" fill="none" stroke="#2b8a3e" stroke-width="1.4" stroke-linejoin="round" /><circle cx="89" cy="40" r="1.4" fill="#2b8a3e"/><circle cx="89" cy="60" r="1.4" fill="#2b8a3e"/><text x="93" y="50.5" font-size="3" text-anchor="start" font-weight="bold" fill="#2b8a3e">← 이 점퍼선이 스위치</text><text x="93" y="55" font-size="2.8" text-anchor="start" font-weight="normal" fill="#2b8a3e">꽂으면 켜짐 / 뽑으면 꺼짐</text><rect x="176" y="30" width="44" height="22" rx="2" fill="#ffe8cc" stroke="#ef8a00" stroke-width=".6"/><text x="198" y="38" font-size="3.4" text-anchor="middle" font-weight="bold" fill="#111">5V 승압 모듈</text><text x="198" y="44" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">IN+ (위)   IN− (아래)</text><rect x="176" y="62" width="44" height="22" rx="2" fill="#ffdeeb" stroke="#c2255c" stroke-width=".6"/><text x="198" y="70" font-size="3.4" text-anchor="middle" font-weight="bold" fill="#111">TB6612</text><text x="198" y="76" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">VM (위)   GND (아래)</text><circle cx="96" cy="60" r="1.4" fill="#d9242f"/><circle cx="103" cy="60" r="1.4" fill="#d9242f"/><polyline points="96,60 96,66 160,66 160,38 176,38" fill="none" stroke="#d9242f" stroke-width="1.2" stroke-linejoin="round" /><text x="122" y="64.5" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">→ 승압 IN+</text><polyline points="103,60 103,72 176,72" fill="none" stroke="#d9242f" stroke-width="1.2" stroke-linejoin="round" /><text x="122" y="70.5" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">→ TB6612 VM</text><circle cx="96" cy="80" r="1.4" fill="#111"/><circle cx="103" cy="80" r="1.4" fill="#111"/><circle cx="110" cy="80" r="1.4" fill="#111"/><polyline points="96,80 96,100 170,100 170,48 176,48" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" /><text x="125" y="98.5" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">→ 승압 IN−</text><polyline points="103,80 103,107 172,107 172,80 176,80" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" /><text x="125" y="105.5" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">→ TB6612 GND</text><polyline points="110,80 110,114" fill="none" stroke="#111" stroke-width="1.2" stroke-linejoin="round" /><text x="113" y="117" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">→ Nano GND</text><rect x="8" y="124" width="212" height="52" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="12" y="132" font-size="3.8" text-anchor="start" font-weight="bold" fill="#111">쓰는 방법</text><text x="12" y="140" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">1. 배터리 빨강 선 끝(벗긴 곳)을 납으로 살짝 굳혀서 "+ 줄 A" 구멍에, 검정 선을 "− 줄" 구멍에 꽂습니다.</text><text x="12" y="148" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">2. 초록 점퍼선으로 "+ 줄 A"와 "+ 줄 B"를 이으면 전원이 켜집니다. 뽑으면 꺼집니다. (스위치 대신)</text><text x="12" y="156" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">3. "+ 줄 B"에서 승압 IN+와 TB6612 VM으로, "− 줄"에서 승압 IN−, TB6612 GND, Nano GND로 선을 냅니다.</text><rect x="8" y="182" width="212" height="22" rx="2" fill="#fff5f5" stroke="#e03131" stroke-width=".5"/><text x="12" y="190" font-size="3.2" text-anchor="start" font-weight="bold" fill="#c92a2a">주의: 빨강(+)과 검정(−)이 서로 닿으면 건전지가 뜨거워지고 위험합니다. 닿지 않게 하세요.</text><text x="12" y="198" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">연결하는 동안에는 초록 점퍼선(스위치)을 뽑아 두고, 모든 연결이 끝난 뒤에 꽂으세요.</text></svg></body></html>
