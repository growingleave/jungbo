<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="212mm" height="236mm" viewBox="0 0 212 236" font-family="inherit"><text x="8" y="10" font-size="5.5" text-anchor="start" font-weight="bold" fill="#111">N20 모터에 전선 땜하기</text><rect x="20" y="30" width="30" height="20" rx="2" fill="#adb5bd" stroke="#495057" stroke-width=".6"/><text x="35" y="42" font-size="3" text-anchor="middle" font-weight="normal" fill="#111">기어박스</text><rect x="50" y="31" width="38" height="18" rx="1" fill="#ced4da" stroke="#495057" stroke-width=".6"/><text x="69" y="42" font-size="3" text-anchor="middle" font-weight="normal" fill="#111">모터 몸체</text><rect x="12" y="38" width="8" height="4" fill="#868e96"/><text x="12" y="28" font-size="3" text-anchor="start" font-weight="normal" fill="#111">축(바퀴 쪽)</text><rect x="88" y="33" width="9" height="3" fill="#e9b949" stroke="#8a6d1d" stroke-width=".3"/><rect x="88" y="44" width="9" height="3" fill="#e9b949" stroke="#8a6d1d" stroke-width=".3"/><circle cx="94" cy="34.5" r=".8" fill="#fff" stroke="#8a6d1d" stroke-width=".2"/><circle cx="94" cy="45.5" r=".8" fill="#fff" stroke="#8a6d1d" stroke-width=".2"/><line x1="92" y1="24" x2="92" y2="32" stroke="#c92a2a" stroke-width=".5"/><text x="92" y="22" font-size="3.2" text-anchor="middle" font-weight="bold" fill="#c92a2a">금속 단자 2개 (여기에 땜)</text><text x="92" y="56" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">(모터 맨 뒤쪽)</text><rect x="8" y="80" width="94" height="40" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="12" y="88" font-size="4" text-anchor="start" font-weight="bold" fill="#111">① 전선 끝 벗기기</text><text x="12" y="96" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">전선 끝의 피복(색 있는 껍질)을</text><text x="12" y="102" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">3mm 정도 벗겨 금속 선이 보이게 합니다.</text><rect x="108" y="80" width="94" height="40" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="112" y="88" font-size="4" text-anchor="start" font-weight="bold" fill="#111">② 납 묻혀 두기</text><text x="112" y="96" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">벗긴 전선 끝과 모터 단자에</text><text x="112" y="102" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">납을 아주 조금씩 미리 묻혀 둡니다.</text><rect x="8" y="126" width="94" height="40" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="12" y="134" font-size="4" text-anchor="start" font-weight="bold" fill="#111">③ 맞대고 가열</text><text x="12" y="142" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">전선을 단자에 대고 인두를</text><text x="12" y="148" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">1~2초만 댑니다. 납이 붙으면 뗍니다.</text><rect x="108" y="126" width="94" height="40" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="112" y="134" font-size="4" text-anchor="start" font-weight="bold" fill="#111">④ 확인</text><text x="112" y="142" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">전선을 살짝 당겨 봐서 안 빠지면 성공.</text><text x="112" y="148" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">두 단자의 납이 닿지 않아야 합니다.</text><rect x="8" y="176" width="194" height="40" rx="2" fill="#fff5f5" stroke="#e03131" stroke-width=".5"/><text x="12" y="184" font-size="3.8" text-anchor="start" font-weight="bold" fill="#c92a2a">주의할 점</text><text x="12" y="191.5" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· 인두를 오래 대면 모터 안쪽(플라스틱)이 녹습니다. 한 단자에 3초 이내로 합니다.</text><text x="12" y="199" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· 두 단자에 납이 이어지면 안 됩니다(전기가 새서 모터가 안 돕니다).</text><text x="12" y="206.5" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· 어느 선이 어느 단자인지는 상관없습니다. 돌려 보고 방향이 반대면 선만 바꾸면 됩니다.</text><text x="8" y="224" font-size="3.1" text-anchor="start" font-weight="bold" fill="#111">팁: 암-수 점퍼선을 한가운데에서 자르면 전선 2개가 됩니다. 암(구멍) 쪽 반을 모터에 땜하면</text><text x="8" y="230" font-size="3.1" text-anchor="start" font-weight="bold" fill="#111">TB6612의 핀 헤더에 그대로 꽂을 수 있습니다.</text></svg></body></html>
