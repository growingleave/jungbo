="normal" fill="#111">· TB6612 모듈은 제품마다 핀 순서가 다를 수 있습니다. 핀 이름(글자)을 보고 연결하세요.</text><text x="10" y="186" font-size="2.9" text-anchor="start" font-weight="normal" fill="#111">· 모터가 반대로 돌면 그쪽 모터 선 2개(AO1↔AO2 또는 BO1↔BO2)를 서로 바꾸세요.</text><text x="10" y="192" font-size="2.9" text-anchor="start" font-weight="normal" fill="#111">· 콘덴서 470µF는 VM과 GND 사이에 연결합니다(긴 다리가 VM). 컴퓨터 USB로 코드를 올릴 때는 스위치를 끄세요.</text><text x="10" y="198" font-size="2.9" text-anchor="start" font-weight="normal" fill="#111">· 센서 5개는 이 그림에 없습니다. 센서는 배선도의 A4(SDA), A5(SCL), D2~D6, 5V, GND에 연결합니다.</text></svg></body></html>
