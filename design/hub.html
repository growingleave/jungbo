<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="212mm" height="212mm" viewBox="0 0 212 212" font-family="inherit"><text x="8" y="10" font-size="5" text-anchor="start" font-weight="bold" fill="#111">센서 5개를 한 판에 모으는 방법 (브레드보드 B)</text><text x="8" y="17" font-size="3" text-anchor="start" font-weight="normal" fill="#111">세로 5칸은 안에서 서로 연결되어 있습니다. 5칸이 모자라서, 이웃한 두 줄을 짧은 선으로 이어서 씁니다.</text><rect x="6" y="32" width="152" height="69" rx="2" fill="#f8f9fa" stroke="#adb5bd" stroke-width=".6"/><circle cx="14" cy="40" r="1.6" fill="#ced4da"/><circle cx="14" cy="47" r="1.6" fill="#ced4da"/><circle cx="14" cy="54" r="1.6" fill="#ced4da"/><circle cx="14" cy="61" r="1.6" fill="#ced4da"/><circle cx="14" cy="68" r="1.6" fill="#ced4da"/><rect x="10" y="36" width="8" height="36" rx="2" fill="#d9242f" fill-opacity=".13" stroke="#d9242f" stroke-width=".4"/><circle cx="31" cy="40" r="1.6" fill="#ced4da"/><circle cx="31" cy="47" r="1.6" fill="#ced4da"/><circle cx="31" cy="54" r="1.6" fill="#ced4da"/><circle cx="31" cy="61" r="1.6" fill="#ced4da"/><circle cx="31" cy="68" r="1.6" fill="#ced4da"/><rect x="27" y="36" width="8" height="36" rx="2" fill="#d9242f" fill-opacity=".13" stroke="#d9242f" stroke-width=".4"/><circle cx="14" cy="40" r="2.2" fill="#3b5bdb"/><circle cx="14" cy="47" r="2.2" fill="#868e96"/><circle cx="14" cy="54" r="2.2" fill="#2f9e5b"/><circle cx="14" cy="61" r="2.2" fill="#2f9e5b"/><circle cx="14" cy="68" r="2.2" fill="#2f9e5b"/><circle cx="31" cy="40" r="2.2" fill="#868e96"/><circle cx="31" cy="47" r="2.2" fill="#2f9e5b"/><circle cx="31" cy="54" r="2.2" fill="#2f9e5b"/><path d="M14,47 q8.5,-9 17,0" fill="none" stroke="#868e96" stroke-width="1"/><text x="22.5" y="31" font-size="4.2" text-anchor="middle" font-weight="bold" fill="#d9242f">5V</text><circle cx="48" cy="40" r="1.6" fill="#ced4da"/><circle cx="48" cy="47" r="1.6" fill="#ced4da"/><circle cx="48" cy="54" r="1.6" fill="#ced4da"/><circle cx="48" cy="61" r="1.6" fill="#ced4da"/><circle cx="48" cy="68" r="1.6" fill="#ced4da"/><rect x="44" y="36" width="8" height="36" rx="2" fill="#111" fill-opacity=".13" stroke="#111" stroke-width=".4"/><circle cx="65" cy="40" r="1.6" fill="#ced4da"/><circle cx="65" cy="47" r="1.6" fill="#ced4da"/><circle cx="65" cy="54" r="1.6" fill="#ced4da"/><circle cx="65" cy="61" r="1.6" fill="#ced4da"/><circle cx="65" cy="68" r="1.6" fill="#ced4da"/><rect x="61" y="36" width="8" height="36" rx="2" fill="#111" fill-opacity=".13" stroke="#111" stroke-width=".4"/><circle cx="48" cy="40" r="2.2" fill="#3b5bdb"/><circle cx="48" cy="47" r="2.2" fill="#868e96"/><circle cx="48" cy="54" r="2.2" fill="#2f9e5b"/><circle cx="48" cy="61" r="2.2" fill="#2f9e5b"/><circle cx="48" cy="68" r="2.2" fill="#2f9e5b"/><circle cx="65" cy="40" r="2.2" fill="#868e96"/><circle cx="65" cy="47" r="2.2" fill="#2f9e5b"/><circle cx="65" cy="54" r="2.2" fill="#2f9e5b"/><path d="M48,47 q8.5,-9 17,0" fill="none" stroke="#868e96" stroke-width="1"/><text x="56.5" y="31" font-size="4.2" text-anchor="middle" font-weight="bold" fill="#111">GND</text><circle cx="82" cy="40" r="1.6" fill="#ced4da"/><circle cx="82" cy="47" r="1.6" fill="#ced4da"/><circle cx="82" cy="54" r="1.6" fill="#ced4da"/><circle cx="82" cy="61" r="1.6" fill="#ced4da"/><circle cx="82" cy="68" r="1.6" fill="#ced4da"/><rect x="78" y="36" width="8" height="36" rx="2" fill="#ef6c00" fill-opacity=".13" stroke="#ef6c00" stroke-width=".4"/><circle cx="99" cy="40" r="1.6" fill="#ced4da"/><circle cx="99" cy="47" r="1.6" fill="#ced4da"/><circle cx="99" cy="54" r="1.6" fill="#ced4da"/><circle cx="99" cy="61" r="1.6" fill="#ced4da"/><circle cx="99" cy="68" r="1.6" fill="#ced4da"/><rect x="95" y="36" width="8" height="36" rx="2" fill="#ef6c00" fill-opacity=".13" stroke="#ef6c00" stroke-width=".4"/><circle cx="82" cy="40" r="2.2" fill="#3b5bdb"/><circle cx="82" cy="47" r="2.2" fill="#868e96"/><circle cx="82" cy="54" r="2.2" fill="#2f9e5b"/><circle cx="82" cy="61" r="2.2" fill="#2f9e5b"/><circle cx="82" cy="68" r="2.2" fill="#2f9e5b"/><circle cx="99" cy="40" r="2.2" fill="#868e96"/><circle cx="99" cy="47" r="2.2" fill="#2f9e5b"/><circle cx="99" cy="54" r="2.2" fill="#2f9e5b"/><path d="M82,47 q8.5,-9 17,0" fill="none" stroke="#868e96" stroke-width="1"/><text x="90.5" y="31" font-size="4.2" text-anchor="middle" font-weight="bold" fill="#ef6c00">SDA</text><circle cx="116" cy="40" r="1.6" fill="#ced4da"/><circle cx="116" cy="47" r="1.6" fill="#ced4da"/><circle cx="116" cy="54" r="1.6" fill="#ced4da"/><circle cx="116" cy="61" r="1.6" fill="#ced4da"/><circle cx="116" cy="68" r="1.6" fill="#ced4da"/><rect x="112" y="36" width="8" height="36" rx="2" fill="#e6a800" fill-opacity=".13" stroke="#e6a800" stroke-width=".4"/><circle cx="133" cy="40" r="1.6" fill="#ced4da"/><circle cx="133" cy="47" r="1.6" fill="#ced4da"/><circle cx="133" cy="54" r="1.6" fill="#ced4da"/><circle cx="133" cy="61" r="1.6" fill="#ced4da"/><circle cx="133" cy="68" r="1.6" fill="#ced4da"/><rect x="129" y="36" width="8" height="36" rx="2" fill="#e6a800" fill-opacity=".13" stroke="#e6a800" stroke-width=".4"/><circle cx="116" cy="40" r="2.2" fill="#3b5bdb"/><circle cx="116" cy="47" r="2.2" fill="#868e96"/><circle cx="116" cy="54" r="2.2" fill="#2f9e5b"/><circle cx="116" cy="61" r="2.2" fill="#2f9e5b"/><circle cx="116" cy="68" r="2.2" fill="#2f9e5b"/><circle cx="133" cy="40" r="2.2" fill="#868e96"/><circle cx="133" cy="47" r="2.2" fill="#2f9e5b"/><circle cx="133" cy="54" r="2.2" fill="#2f9e5b"/><path d="M116,47 q8.5,-9 17,0" fill="none" stroke="#868e96" stroke-width="1"/><text x="124.5" y="31" font-size="4.2" text-anchor="middle" font-weight="bold" fill="#e6a800">SCL</text><text x="8" y="81" font-size="3" text-anchor="start" font-weight="normal" fill="#111">파랑 점: Nano에서 오는 선 1개</text><text x="54" y="81" font-size="3" text-anchor="start" font-weight="normal" fill="#111">초록 점: 센서로 가는 선(줄마다 5개)</text><text x="114" y="81" font-size="3" text-anchor="start" font-weight="normal" fill="#111">회색 호: 두 줄을 잇는 짧은 선</text><text x="8" y="87" font-size="2.9" text-anchor="start" font-weight="normal" fill="#111">※ 5V 줄 = VIN, GND 줄 = GND, SDA 줄 = SDA, SCL 줄 = SCL 로 센서마다 한 개씩 꽂습니다.</text><rect x="6" y="108" width="200" height="92" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="10" y="115" font-size="3.8" text-anchor="start" font-weight="bold" fill="#111">센서마다 따로 연결하는 것 (XSHUT)</text><text x="12" y="123" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 1 (왼쪽 90°)의 XSHUT 선  →  Nano D2</text><text x="12" y="129" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 2 (왼쪽 앞 45°)의 XSHUT 선  →  Nano D3</text><text x="12" y="135" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 3 (앞)의 XSHUT 선  →  Nano D4</text><text x="12" y="141" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 4 (오른쪽 앞 45°)의 XSHUT 선  →  Nano D5</text><text x="12" y="147" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 5 (오른쪽 90°)의 XSHUT 선  →  Nano D6</text><text x="10" y="158" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">센서 5개 모두에 이 4개 선도 연결합니다 (허브 → 센서)</text><text x="12" y="165" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 VIN ← 허브 5V 줄</text><text x="87" y="165" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 GND ← 허브 GND 줄</text><text x="12" y="170.5" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 SDA ← 허브 SDA 줄</text><text x="87" y="170.5" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">센서 SCL ← 허브 SCL 줄</text><text x="10" y="178" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">허브 4줄은 Nano에서 1개씩 이어서 받습니다:</text><text x="12" y="185" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">Nano +5V → 허브 5V 줄</text><text x="87" y="185" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">Nano GND → 허브 GND 줄</text><text x="12" y="190.5" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">Nano A4 → 허브 SDA 줄</text><text x="87" y="190.5" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">Nano A5 → 허브 SCL 줄</text></svg></body></html>
