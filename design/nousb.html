<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font-family:'Noto Sans CJK KR','Noto Sans KR',sans-serif}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="212mm" height="210mm" viewBox="0 0 212 210" font-family="inherit"><text x="8" y="10" font-size="5.5" text-anchor="start" font-weight="bold" fill="#111">USB 선 없이 Nano에 전원 주기</text><text x="8" y="17" font-size="3.2" text-anchor="start" font-weight="normal" fill="#111">승압 모듈이 내보내는 5V를 전선 2개로 Nano 5V, GND에 바로 연결합니다.</text><rect x="12" y="32" width="64" height="40" rx="2" fill="#ffe8cc" stroke="#ef8a00" stroke-width=".6"/><text x="44" y="40" font-size="3.8" text-anchor="middle" font-weight="bold" fill="#111">5V 승압 모듈</text><rect x="14" y="46" width="22" height="14" rx="1" fill="#e9ecef" stroke="#868e96" stroke-width=".4"/><text x="25" y="55" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">USB 구멍</text><text x="25" y="64" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#868e96">(쓰지 않음)</text><text x="46" y="50" font-size="3" text-anchor="start" font-weight="bold" fill="#111">출력 (OUT)</text><text x="46" y="58" font-size="3.2" text-anchor="start" font-weight="bold" fill="#d9242f">OUT+ 5V  ●</text><text x="46" y="66" font-size="3.2" text-anchor="start" font-weight="bold" fill="#111">OUT−  GND ●</text><circle cx="72" cy="57" r="1.5" fill="#d9242f"/><circle cx="72" cy="65" r="1.5" fill="#111"/><text x="12" y="78" font-size="2.8" text-anchor="start" font-weight="normal" fill="#555">입력 IN+, IN− 에는 건전지(+, −)가 연결됩니다</text><rect x="130" y="28" width="62" height="60" rx="2" fill="#dbe4ff" stroke="#3b5bdb" stroke-width=".6"/><text x="161" y="36" font-size="3.8" text-anchor="middle" font-weight="bold" fill="#111">Arduino Nano</text><circle cx="130" cy="50" r="1.5" fill="#d9242f"/><text x="134" y="51.2" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">+5V 핀</text><circle cx="130" cy="66" r="1.5" fill="#111"/><text x="134" y="67.2" font-size="3.4" text-anchor="start" font-weight="bold" fill="#111">GND 핀</text><polyline points="72,57 100,57 100,50 130,50" fill="none" stroke="#d9242f" stroke-width="1.4" stroke-linejoin="round"/><polyline points="72,65 110,65 110,66 130,66" fill="none" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/><rect x="152" y="74" width="30" height="10" rx="1" fill="#adb5bd" stroke="#495057" stroke-width=".4"/><text x="167" y="80.5" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">mini USB 구멍</text><text x="161" y="93" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#1971c2">(프로그램 올릴 때만 사용)</text><rect x="8" y="104" width="196" height="64" rx="2" fill="#fff9db" stroke="#e6a800" stroke-width=".5"/><text x="12" y="112" font-size="3.8" text-anchor="start" font-weight="bold" fill="#111">바뀌는 것</text><text x="12" y="121" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· 파란 USB 선(승압 모듈 ↔ Nano)을 없앱니다. 빨강(5V)과 검정(GND) 전선 2개로 대신합니다.</text><text x="12" y="130" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· Nano의 mini USB 구멍은 프로그램을 올릴 때만 컴퓨터 USB 선을 꽂아 씁니다. 평소에는 비어 있습니다.</text><text x="12" y="139" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· 건전지 전원(스위치로 쓰는 점퍼선)을 뽑은 상태에서만 컴퓨터 USB를 꽂으세요. 전원 두 개가 동시에 들어가는 것을 막습니다.</text><text x="12" y="148" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">· 이 연결이 Nano에 전기를 주는 유일한 길입니다. 전선이 헐거우면 로봇이 꺼지니 땜하거나 단단히 고정하세요.</text><rect x="8" y="174" width="196" height="30" rx="2" fill="#fff5f5" stroke="#e03131" stroke-width=".5"/><text x="12" y="182" font-size="3.6" text-anchor="start" font-weight="bold" fill="#c92a2a">승압 모듈에 OUT+ / OUT− 패드가 없는 경우</text><text x="12" y="190" font-size="3.1" text-anchor="start" font-weight="normal" fill="#111">USB 구멍 안쪽의 +5V 핀과 GND 핀(보통 양 끝의 핀)에 전선을 땜합니다. 모듈 사진을 보내 주시면 어디가 5V이고 GND인지 읽어 드립니다.</text><text x="12" y="197" font-size="3.1" text-anchor="start" font-weight="bold" fill="#c92a2a">※ 5V 핀을 거꾸로 연결하면 Nano가 망가집니다. 땜하기 전에 +와 −를 꼭 확인하세요.</text></svg></body></html>
