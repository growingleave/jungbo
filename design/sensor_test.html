999999996" font-size="3.8" text-anchor="middle" font-weight="bold" fill="#c92a2a">①</text><circle cx="112" cy="38.8" r="3.4" fill="#fff" stroke="#c92a2a" stroke-width=".6"/><text x="112" y="40.099999999999994" font-size="3.8" text-anchor="middle" font-weight="bold" fill="#c92a2a">②</text><circle cx="112" cy="84.3" r="3.4" fill="#fff" stroke="#c92a2a" stroke-width=".6"/><text x="112" y="85.6" font-size="3.8" text-anchor="middle" font-weight="bold" fill="#c92a2a">③</text><circle cx="112" cy="69.3" r="3.4" fill="#fff" stroke="#c92a2a" stroke-width=".6"/><text x="112" y="70.6" font-size="3.8" text-anchor="middle" font-weight="bold" fill="#c92a2a">④</text><rect x="6" y="104" width="38" height="22" rx="2" fill="#f1f3f5" stroke="#868e96" stroke-width=".6"/><text x="25" y="113" font-size="3.6" text-anchor="middle" font-weight="bold" fill="#111">컴퓨터</text><text x="25" y="119" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">Arduino IDE</text><polyline points="44,115 52,115 52,142 80,142 80,142" fill="none" stroke="#495057" stroke-width="1.4" stroke-linejoin="round" /><text x="52" y="146" font-size="2.8" text-anchor="start" font-weight="normal" fill="#111">USB 케이블</text><rect x="6" y="152" width="285" height="52" rx="2" fill="#f8f9fa" stroke="#adb5bd" stroke-width=".4"/><text x="10" y="160" font-size="3.1" text-anchor="start" font-weight="bold" fill="#111">순서: ① Nano 5V → 센서 VIN   ② Nano GND → 센서 GND   ③ Nano A4 → 센서 SDA   ④ Nano A5 → 센서 SCL   (센서 GPIO1, XSHUT은 연결하지 않음)</text><text x="10" y="168" font-size="3" text-anchor="start" font-weight="normal" fill="#111">· 연결하기 전에 USB를 뽑아 둡니다. 선을 다 연결한 뒤에 USB를 꽂습니다.</text><text x="10" y="174.5" font-size="3" text-anchor="start" font-weight="normal" fill="#111">· SDA와 SCL을 바꿔 꽂기 쉽습니다. 센서 핀 순서는 VIN, GND, SCL, SDA 입니다(GND 다음이 SCL).</text><text x="10" y="181" font-size="3" text-anchor="start" font-weight="normal" fill="#111">· VIN은 Nano 위쪽의 "VIN" 핀이 아니라 "5V" 핀에 연결합니다(두 핀이 가깝게 있습니다).</text><text x="10" y="187.5" font-size="3" text-anchor="start" font-weight="normal" fill="#111">· 판매 페이지에 센서 VIN 입력이 3.3V만 가능하다고 되어 있으면 5V 대신 Nano의 3V3 핀에 연결합니다.</text><text x="10" y="194" font-size="3" text-anchor="start" font-weight="normal" fill="#111">· 연결한 뒤 I2C 스캐너 코드를 올리고 시리얼 모니터(9600)에서 0x29가 나오는지 확인합니다.</text></svg></body></html>
