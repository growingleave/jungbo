t-size="2.6" text-anchor="middle" fill="#c78a00">배터리 홀더</text></g></g><text x="105" y="178" font-size="3" text-anchor="middle" font-weight="bold" fill="#1b7a43">초록 칸 = 센서용 판지 받침을 붙일 자리 (굵은 초록 선이 접히는 선 = 받침 앞쪽 기준선)</text><text x="105" y="183" font-size="3" text-anchor="middle" font-weight="normal" fill="#1b7a43">초록 점선(굵은 선 바깥) = 센서 보드 앞면(렌즈 면)이 오는 위치. 중심에서 52mm</text><g transform="translate(0,200)"><line x1="55" y1="0" x2="155" y2="0" stroke="#111" stroke-width="0.5" /><line x1="55" y1="-2" x2="55" y2="2" stroke="#111" stroke-width="0.3" /><line x1="65" y1="-2" x2="65" y2="2" stroke="#111" stroke-width="0.3" /><line x1="75" y1="-2" x2="75" y2="2" stroke="#111" stroke-width="0.3" /><line x1="85" y1="-2" x2="85" y2="2" stroke="#111" stroke-width="0.3" /><line x1="95" y1="-2" x2="95" y2="2" stroke="#111" stroke-width="0.3" /><line x1="105" y1="-2" x2="105" y2="2" stroke="#111" stroke-width="0.3" /><line x1="115" y1="-2" x2="115" y2="2" stroke="#111" stroke-width="0.3" /><line x1="125" y1="-2" x2="125" y2="2" stroke="#111" stroke-width="0.3" /><line x1="135" y1="-2" x2="135" y2="2" stroke="#111" stroke-width="0.3" /><line x1="145" y1="-2" x2="145" y2="2" stroke="#111" stroke-width="0.3" /><line x1="155" y1="-2" x2="155" y2="2" stroke="#111" stroke-width="0.3" /><text x="105" y="7" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">이 선의 길이가 정확히 100mm(자로 재서 확인)이면 100%로 올바르게 인쇄된 것입니다</text></g><text x="8" y="222" font-size="4" text-anchor="start" font-weight="bold" fill="#111">만드는 순서</text><text x="8" y="229" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">1. 100%로 인쇄(쪽 맞춤 금지)하고, 위의 100mm 선이 정확한지 자로 확인합니다.</text><text x="8" y="235" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">2. 도안을 판지(두께 2~3mm)에 풀(스프레이풀이나 딱풀)로 붙입니다.</text><text x="8" y="241" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">3. 굵은 검은 원을 칼로 자릅니다. 칼을 세워서 여러 번 나눠 그으면 깔끔합니다.</text><text x="8" y="247" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">4. 빨간 구멍은 송곳이나 지름 3.4mm 펀치로 뚫고, 빨간 홈은 칼로 가늡니다.</text><text x="8" y="253" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">5. 도안 종이는 붙인 채로 두고 쓰거나, 선 위치를 연필로 표시한 뒤 떼도 됩니다.</text></svg></div><div class="pg"><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="inherit"><text x="8" y="12" font-size="6" text-anchor="start" font-weight="bold" fill="#111">② 아래판 도안 (옆면 평평)</text><text x="8" y="18.5" font-size="3" text-anchor="start" font-weight="normal" fill="#111">자르는 선은 굵은 검은 선입니다. 모터는 판 아래에 지퍼타이로 달고, 나머지 부품은 양면테이프로 붙입니다.</text><g transform="translate(105,100)"><line x1="-62" y1="0" x2="62" y2="0" stroke="#bbb" stroke-width="0.2" stroke-dasharray="2 1"/><line x1="0" y1="-62" x2="0" y2="62" stroke="#bbb" stroke-width="0.2" stroke-dasharray="2 1"/><path d="M 45,-31.622776601683793 A 55 55 0 0 0 -45,-31.622776601683793 L -45,31.622776601683793 A 55 55 0 0 0 45,31.622776601683793 Z" fill="#fff" stroke="#111" stroke-width=".6"/><circle cx="-32" cy="-14" r="1.7" fill="#fff" stroke="#c92a2a" stroke-width=".4"/><line x1="-35" y1="-14" x2="-29" y2="-14" stroke="#c92a2a" stroke-width="0.2" /><line x1="-32" y1="-17" x2="-32" y2="-11" stroke="#c92a2a" stroke-width="0.2" /><circle cx="32" cy="-14" r="1.7" fill="#fff" stroke="#c92a2a" stroke-width=".4"/><line x1="29" y1="-14" x2="35" y2="-14" stroke="#c92a2a" stroke-width="0.2" /><line x1="32" y1="-17" x2="32" y2="-11" stroke="#c92a2a" stroke-width="0.2" /><circle cx="-40" cy="24" r="1.7" fill="#fff" stroke="#c92a2a" stroke-width=".4"/><line x1="-43" y1="24" x2="-37" y2="24" stroke="#c92a2a" stroke-width="0.2" /><line x1="-40" y1="21" x2="-40" y2="27" stroke="#c92a2a" stroke-width="0.2" /><circle cx="40" cy="24" r="1.7" fill="#fff" stroke="#c92a2a" stroke-width=".4"/><line x1="37" y1="24" x2="43" y2="24" stroke="#c92a2a" stroke-width="0.2" /><line x1="40" y1="21" x2="40" y2="27" stroke="#c92a2a" stroke-width="0.2" /><rect x="-4 /text></g><g transform="translate(0,-37) rotate(0)"><rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#d6336c" stroke-width=".25" stroke-dasharray="1.5 1"/><text x="0" y="1" font-size="2.6" text-anchor="middle" fill="#d6336c">TB6612</text></g><g transform="translate(28,26) rotate(0)"><rect x="-8" y="-12.5" width="16" height="25" fill="none" stroke="#ef8a00" stroke-width=".25" stroke-dasharray="1.5 1"/><text x="0" y="1" font-size="2.6" text-anchor="middle" fill="#ef8a00">승압</text></g><g transform="translate(0,45) rotate(0)"><rect x="-5" y="-5" width="10" height="10" fill="none" stroke="#555" stroke-width=".25" stroke-dasharray="1.5 1"/><text x="0" y="1" font-size="2.6" text-anchor="middle" fill="#555">캐스터</text></g><line x1="-45" y1="-70" x2="45" y2="-70" stroke="#c92a2a" stroke-width="0.3" /><text x="0" y="-72" font-size="2.8" text-anchor="middle" font-weight="bold" fill="#c92a2a">평평한 면 사이 90mm</text></g><g transform="translate(0,200)"><line x1="55" y1="0" x2="155" y2="0" stroke="#111" stroke-width="0.5" /><line x1="55" y1="-2" x2="55" y2="2" stroke="#111" stroke-width="0.3" /><line x1="65" y1="-2" x2="65" y2="2" stroke="#111" stroke-width="0.3" /><line x1="75" y1="-2" x2="75" y2="2" stroke="#111" stroke-width="0.3" /><line x1="85" y1="-2" x2="85" y2="2" stroke="#111" stroke-width="0.3" /><line x1="95" y1="-2" x2="95" y2="2" stroke="#111" stroke-width="0.3" /><line x1="105" y1="-2" x2="105" y2="2" stroke="#111" stroke-width="0.3" /><line x1="115" y1="-2" x2="115" y2="2" stroke="#111" stroke-width="0.3" /><line x1="125" y1="-2" x2="125" y2="2" stroke="#111" stroke-width="0.3" /><line x1="135" y1="-2" x2="135" y2="2" stroke="#111" stroke-width="0.3" /><line x1="145" y1="-2" x2="145" y2="2" stroke="#111" stroke-width="0.3" /><line x1="155" y1="-2" x2="155" y2="2" stroke="#111" stroke-width="0.3" /><text x="105" y="7" font-size="2.8" text-anchor="middle" font-weight="normal" fill="#111">이 선의 길이가 정확히 100mm(자로 재서 확인)이면 100%로 올바르게 인쇄된 것입니다</text></g><text x="8" y="222" font-size="4" text-anchor="start" font-weight="bold" fill="#111">붙이는 위치와 주의</text><text x="8" y="229" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">· 점선 상자는 그 부품의 위치입니다. 모터는 판 아래쪽에 달고, 지퍼타이는 두 홈에 통과시켜 모터를 감습니다.</text><text x="8" y="235" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">· 바퀴 점선(양옆)은 바퀴가 올 자리입니다. 판 옆면(평평한 선)이 바퀴에 닿지 않아야 합니다.</text><text x="8" y="241" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">· 모터 축은 가운데 가로 점선(y=0) 위에 오도록 달아야 로봇이 곧게 갑니다.</text><text x="8" y="247" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">· 캐스터(뒤 바퀴)는 두 홈에 지퍼타이로 고정하고, 판이 수평인지 확인합니다.</text></svg></div><div class="pg"><svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="inherit"><text x="8" y="12" font-size="6" text-anchor="start" font-weight="bold" fill="#111">③ 센서 받침 (판지 ×5)와 기둥</text><text x="8" y="18.5" font-size="3" text-anchor="start" font-weight="normal" fill="#111">굵은 검은 선 = 자름, 파란 점선 = 접는 선. 얇은 판지(0.5~1mm: 책 표지나 포장 상자)로 만듭니다.</text><g transform="translate(10,28)"><rect x="0" y="0" width="27" height="7" fill="#fff" stroke="#111" stroke-width=".5"/><rect x="0" y="7" width="27" height="8" fill="#fff" stroke="#111" stroke-width=".5"/><line x1="0" y1="7" x2="27" y2="7" stroke="#1971c2" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="13.5" y="5" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">바닥 (판에 붙임)</text><text x="13.5" y="11" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">세우는 면(8mm)</text><text x="13.5" y="22" font-size="3" text-anchor="middle" font-weight="bold" fill="#111">센서 1 (-90°)</text></g><g transform="translate(76,28)"><rect x="0" y="0" width="27" height="7" fill="#fff" stroke="#111" stroke-width=".5"/><rect x="0" y="7" width="27" height="8" fill="#fff" stroke="#111" stroke-width=".5"/><line x1="0" y1="7" x2="27" y2="7" stroke="#1971c2" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="13.5" y="5" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">바닥 (판에 붙임)</text><text x="13.5" y="11" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">세우는 면(8mm)</text><text x="13.5" y="22" font-size="3" text-anchor="middle" font-weight="bold" fill="#111">센서 2 (-45°)</text></g><g transform="translate(142,28)"><rect x="0" y="0" width="27" height="7" fill="#fff" stroke="#111" stroke-width=".5"/><rect x="0" y="7" width="27" height="8" fill="#fff" stroke="#111" stroke-width=".5"/><line x1="0" y1="7" x2="27" y2="7" stroke="#1971c2" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="13.5" y="5" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">바닥 (판에 붙임)</text><text x="13.5" y="11" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">세우는 면(8mm)</text><text x="13.5" y="22" font-size="3" text-anchor="middle" font-weight="bold" fill="#111">센서 3 (0°)</text></g><g transform="translate(10,98)"><rect x="0" y="0" width="27" height="7" fill="#fff" stroke="#111" stroke-width=".5"/><rect x="0" y="7" width="27" height="8" fill="#fff" stroke="#111" stroke-width=".5"/><line x1="0" y1="7" x2="27" y2="7" stroke="#1971c2" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="13.5" y="5" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">바닥 (판에 붙임)</text><text x="13.5" y="11" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">세우는 면(8mm)</text><text x="13.5" y="22" font-size="3" text-anchor="middle" font-weight="bold" fill="#111">센서 4 (+45°)</text></g><g transform="translate(76,98)"><rect x="0" y="0" width="27" height="7" fill="#fff" stroke="#111" stroke-width=".5"/><rect x="0" y="7" width="27" height="8" fill="#fff" stroke="#111" stroke-width=".5"/><line x1="0" y1="7" x2="27" y2="7" stroke="#1971c2" stroke-width="0.5" stroke-dasharray="2 1.2"/><text x="13.5" y="5" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">바닥 (판에 붙임)</text><text x="13.5" y="11" font-size="2.6" text-anchor="middle" font-weight="normal" fill="#111">세우는 면(8mm)</text><text x="13.5" y="22" font-size="3" text-anchor="middle" font-weight="bold" fill="#111">센서 5 (+90°)</text></g><text x="8" y="172" font-size="4" text-anchor="start" font-weight="bold" fill="#111">받침 사용법</text><text x="8" y="178" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">1. 5장을 잘라 파란 점선에서 직각(L자)으로 접습니다. 크기는 가로 27mm, 바닥 7mm, 세우는 면 8mm(낮게)입니다.</text><text x="8" y="184" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">2. 바닥 쪽을 1쪽 도안의 초록 칸에 풀로 붙입니다. 접힌 선이 굵은 초록 선(센서 기준선)과 일치해야 합니다.</text><text x="8" y="190" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">3. 센서 보드의 아래쪽만 세우는 면 앞에 양면테이프로 붙입니다. 렌즈는 바깥, 핀 줄은 위로 가게 합니다.</text><text x="8" y="196" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">4. 점퍼선은 보드 뒤(안쪽)에서 위쪽 핀 줄에 꽂습니다. 받침이 낮아서 핀과 커넥터가 받침에 닿지 않습니다.</text><text x="8" y="202" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">5. 선은 안쪽으로 낮게 모아 테이프로 판에 붙입니다. ±45° 센서는 선이 브레드보드 A 모서리에 닿는지 확인하세요.</text><text x="8" y="218" font-size="4" text-anchor="start" font-weight="bold" fill="#111">기둥 4개 (위판과 아래판 사이, 높이 30mm)</text><text x="8" y="225" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">판지 기둥이 없으면 볼펜 대나 빨대를 30mm로 잘라 쓰세요. 네 개의 길이를 똑같이 맞추는 것이 중요합니다(판이 수평이 됩니다).</text><text x="8" y="231" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">아래판 구멍과 위판 구멍 위에 기둥을 세우고, 구멍 위치마다 풀 또는 뜨거운 글루건으로 고정합니다.</text><text x="8" y="237" font-size="3.3" text-anchor="start" font-weight="normal" fill="#111">판 두께가 2mm보다 두꺼우면(예: 3mm) 그만큼 기둥을 조금 더 길게(31mm) 해도 됩니다.</text></svg></div></body></html>
